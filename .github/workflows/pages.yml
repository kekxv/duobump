name: Validate and deploy DuoBump

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duobump-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - name: Configure GitHub Pages paths
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const base = repo.toLowerCase() === `${owner.toLowerCase()}.github.io` ? '/' : `/${repo}/`;
          appendFileSync(process.env.GITHUB_ENV, `SITE_URL=https://${owner}.github.io\nBASE_PATH=${base}\n`);
          JS
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure preview site paths
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const base = repo.toLowerCase() === `${owner.toLowerCase()}.github.io` ? '/' : `/${repo}/`;
          appendFileSync(process.env.GITHUB_ENV, `SITE_URL=https://${owner}.github.io\nBASE_PATH=${base}\nPUBLIC_RELEASE=false\n`);
          JS
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish preview static site
        id: deployment
        uses: actions/deploy-pages@v4
